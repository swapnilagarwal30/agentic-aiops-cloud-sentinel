apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-infrastructure-workload
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/swapnilagarwal30/agentic-aiops-cloud-sentinel.git'
    targetRevision: HEAD
    path: gitops/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

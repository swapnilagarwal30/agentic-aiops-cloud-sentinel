apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Polling interval for GitOps repository changes (in seconds)
  timeout.reconciliation: "60"
  resource.customizations: |
    apps/Deployment:
      health.lua: |
        hs = {}
        hs.status = "Healthy"
        return hs
